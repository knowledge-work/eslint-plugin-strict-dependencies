name: Publish

on:
  workflow_dispatch:
    inputs:
      versionClass:
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
  schedule:
    - cron: "0 0 15 * *" # at AM 9 JST on day of month 15

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    # Requires approval before publishing (see the repository's environment settings)
    environment: npm
    permissions:
      id-token: write # Required for trusted publishing (OIDC)
      contents: write # Push the version commit and tag, and create the release

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # pnpm version comes from `packageManager`, and Node.js from `devEngines.runtime` in package.json.
      # No dependency cache in this job.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bump version and publish
        id: bump-version
        env:
          VERSION_CLASS: ${{ github.event_name == 'schedule' && 'patch' || inputs.versionClass }}
        run: |
          git config user.name '[bot] github action (${{ github.workflow }})'
          git config user.email 'engineer-team@knowledgework.com'
          pnpm version "$VERSION_CLASS" -m "v%s"
          pnpm run release
          echo "new_version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          NEW_VERSION: ${{ steps.bump-version.outputs.new_version }}
        with:
          script: |
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${process.env.NEW_VERSION}`,
              generate_release_notes: true,
            })
